[package]
name = "procweaver-portable-update"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "ProcWeaverUpdater"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
base64 = "=0.22.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
ring = "=0.17.14"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2"] }
