<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProcWeaver - 现代代理分流控制台</title>
    <!-- Zero-FOUC 阻塞式主题注入脚本 -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("procweaver_theme") || localStorage.getItem("netbox_theme") || "system";
          var isDark = false;
          if (theme === "dark") {
            isDark = true;
          } else if (theme === "system") {
            isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="overflow-hidden select-none bg-[var(--surface-canvas)] text-[var(--text-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
